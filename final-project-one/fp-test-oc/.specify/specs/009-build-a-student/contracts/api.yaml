openapi: 3.0.0
info:
  title: Student Skills Marketplace API
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
paths:
  /register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                email: {type: string}
                password: {type: string}
                role: {type: string, enum: [buyer, seller]}
      responses:
        201: {description: User created}
  /login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        200: {description: Login successful}
  /listings:
    get:
      summary: Get listings
      parameters:
        - name: search
          in: query
          schema: {type: string}
      responses:
        200: {description: List of listings}
    post:
      summary: Create listing
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skill_id: {type: integer}
                title: {type: string}
                description: {type: string}
                price: {type: number}
      responses:
        201: {description: Listing created}
  /listings/{id}:
    get:
      summary: Get listing
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        200: {description: Listing details}
    put:
      summary: Update listing
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string}
                description: {type: string}
                price: {type: number}
                status: {type: string}
      responses:
        200: {description: Listing updated}
    delete:
      summary: Delete listing
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        204: {description: Listing deleted}
  /orders:
    get:
      summary: Get user orders
      security: [{bearerAuth: []}]
      responses:
        200: {description: List of orders}
    post:
      summary: Create order
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                listing_id: {type: integer}
      responses:
        201: {description: Order created}
  /payments:
    post:
      summary: Process payment
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: {type: integer}
                payment_method_id: {type: string}
      responses:
        200: {description: Payment processed}
  /reviews:
    post:
      summary: Create review
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: {type: integer}
                rating: {type: integer}
                comment: {type: string}
      responses:
        201: {description: Review created}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer