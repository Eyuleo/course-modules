openapi: 3.0.3
info:
  title: Student Skills Marketplace API
  version: 0.1.0
servers:
  - url: https://api.local/v1
paths:
  /auth/register:
    post:
      summary: Register a new user (student or client)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                role: { type: string, enum: [student, client] }
      responses:
        "201": { description: Created }
  /auth/login:
    post:
      summary: Login and retrieve token
      responses:
        "200": { description: OK }
  /listings:
    get:
      summary: Browse listings with filters
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: min_price
          schema: { type: integer }
        - in: query
          name: max_price
          schema: { type: integer }
        - in: query
          name: delivery_days
          schema: { type: integer }
      responses:
        "200": { description: OK }
    post:
      summary: Create a listing (student)
      responses:
        "201": { description: Created }
  /orders:
    post:
      summary: Create an order from a listing
      responses:
        "201": { description: Created }
  /orders/{id}/fund:
    post:
      summary: Create PaymentIntent and fund escrow
      responses:
        "200": { description: OK }
  /orders/{id}/accept:
    post:
      summary: Student accepts order
      responses:
        "200": { description: OK }
  /orders/{id}/deliver:
    post:
      summary: Submit deliverables
      responses:
        "200": { description: OK }
  /orders/{id}/approve:
    post:
      summary: Client approves and release
      responses:
        "200": { description: OK }
  /orders/{id}/cancel:
    post:
      summary: Cancel order
      responses:
        "200": { description: OK }
  /messages/threads/{context}/{id}:
    get:
      summary: Get thread messages
      responses:
        "200": { description: OK }
    post:
      summary: Send message
      responses:
        "201": { description: Created }
  /reviews:
    post:
      summary: Leave a review
      responses:
        "201": { description: Created }
  /stripe/webhook:
    post:
      summary: Stripe webhook endpoint
      responses:
        "200": { description: OK }
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Token
security:
  - sanctum: []
